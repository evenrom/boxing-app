<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Boxing Pro">
    <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/evenrom/boxing-timer-assets/refs/heads/main/icon.png">

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0b0b0b">
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/evenrom/boxing-timer-assets/refs/heads/main/icon.png">

    <title>Boxing Pro Trainer</title>

    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;700&family=Teko:wght@500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,700,0,0" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <div id="setup-screen">
        <div class="dashboard-grid">
            <div class="setup-right">
                <div class="diff-btn active" id="btn-rookie"><div class="diff-title">ROOKIE</div><div class="diff-details">3 MIN ROUND • 20 SEC REST</div></div>
                <div class="diff-btn" id="btn-pro"><div class="diff-title">PRO</div><div class="diff-details">5 MIN ROUND • 30 SEC REST</div></div>
                <div class="diff-btn" id="btn-champ"><div class="diff-title">CHAMP</div><div class="diff-details">10 MIN ROUND • 60 SEC REST</div></div>
            </div>
            <div class="setup-left">
                <div class="rounds-wrapper">
                    <div class="rounds-title">ROUNDS</div>
                    <div class="counter-controls"><div class="c-btn" id="btn-minus">−</div><span id="setupRoundCount">8</span><div class="c-btn" id="btn-plus">+</div></div>
                    <div class="info-label">TOTAL SESSION TIME</div><div id="totalTimePreview" style="font-family:'Teko'; font-size:2.5rem; color:#fff;"></div>
                </div>
            </div>
        </div>
        <div class="start-container"><button class="btn-start" id="btn-start-fight">START FIGHT</button></div>
    </div>

    <div id="timer-screen">
        <div class="dashboard-grid" style="overflow: hidden; padding-bottom: 0;">
            <div class="timer-left">
                <div id="mainTimer" class="main-clock">00:00</div>
                <div class="info-label">TOTAL SESSION TIME</div>
                <div id="totalTimer" class="sub-clock">00:00</div>
            </div>
            <div class="timer-right">
                <div id="statusText" class="rounds-title" style="font-size: 4rem; margin-bottom: 10px;">ROUND 1</div>
                <div class="pattern-box"><div class="pattern-label">CURRENT COMBO</div><div id="currentPattern"></div></div>
                <div style="padding-left: 10px;"><div class="pattern-label">NEXT UP</div><div id="nextPattern"></div></div>
            </div>
        </div>
        <div class="timer-controls">
            <button class="btn-control btn-pause" id="pauseBtn">PAUSE</button>
            <button class="btn-control btn-stop" id="stopBtn">END</button>
        </div>
    </div>

    <div id="finish-screen">
        <h1 class="finish-title">VICTORY</h1>
        <div class="finish-level" id="finishLevelText">PRO LEVEL COMPLETED</div>
        <div class="finish-stat"><span style="color:#888; text-transform: uppercase; font-size: 0.9rem;">Rounds Completed</span><br><span id="finishRoundsVal" style="font-family:'Teko'; font-size: 3rem; color:var(--work-color);">8</span></div>
        <button class="btn-start" id="btn-restart">NEW WORKOUT</button>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
