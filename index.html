<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>Boxing Pro Trainer</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Boxing Pro">
    <meta name="theme-color" content="#0b0b0b">
    <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/evenrom/boxing-timer-assets/refs/heads/main/icon.png">
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/evenrom/boxing-timer-assets/refs/heads/main/icon.png">

    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;700&family=Teko:wght@500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="h-screen w-screen overflow-hidden select-none bg-[#0b0b0b] font-['Assistant'] text-white">

<div class="h-full w-full max-w-[1200px] mx-auto flex flex-col p-4 bg-gradient-to-b from-[#181818] to-[#0e0e0e] relative">
    
    <div class="flex items-center justify-between pb-2 border-b border-[#222] shrink-0">
        <button id="muteBtn" class="p-3 text-gray-400 hover:text-[var(--theme-accent)] transition-colors active:scale-95">
            <span class="material-symbols-outlined text-[2.6rem]">volume_up</span>
        </button>
        <div class="font-['Teko'] text-3xl tracking-[4px] font-bold text-center flex-1 pr-12">BOXING COUNTDOWN</div>
    </div>

    <div id="setup-screen" class="flex flex-col flex-1 min-h-0 container-view">
        <div class="flex flex-1 gap-6 min-h-0 items-center mt-4">
            <div class="flex-1 flex flex-col gap-3 justify-center">
                <div id="btn-tyson" class="diff-btn border border-[#333] p-4 rounded-xl cursor-pointer bg-white/5 transition-all" onclick="app.selectDiff('TYSON')">
                    <div class="font-['Teko'] text-2xl tracking-wide text-gray-400">MIKE TYSON</div>
                    <div class="text-xs text-gray-500">5 MIN • 30 SEC REST</div>
                </div>
                <div id="btn-mayweather" class="diff-btn border border-[#333] p-4 rounded-xl cursor-pointer bg-white/5 transition-all" onclick="app.selectDiff('MAYWEATHER')">
                    <div class="font-['Teko'] text-2xl tracking-wide text-gray-400">FLOYD MAYWEATHER</div>
                    <div class="text-xs text-gray-500">5 MIN • 30 SEC REST</div>
                </div>
                <div id="btn-ali" class="diff-btn border border-[#333] p-4 rounded-xl cursor-pointer bg-white/5 transition-all" onclick="app.selectDiff('ALI')">
                    <div class="font-['Teko'] text-2xl tracking-wide text-gray-400">MUHAMMAD ALI</div>
                    <div class="text-xs text-gray-500">5 MIN • 30 SEC REST</div>
                </div>
            </div>

            <div class="flex-1 flex flex-col items-center justify-center border-l border-r border-[#222] h-4/5 px-4">
                <div class="font-['Teko'] text-3xl text-[var(--theme-accent)] tracking-wider">ROUNDS</div>
                <div class="flex items-center gap-6 my-4">
                    <div id="btn-minus" class="w-14 h-14 rounded-full bg-[#222] border border-[#444] text-2xl flex items-center justify-center cursor-pointer active:bg-[var(--theme-accent)] active:text-black transition-colors">−</div>
                    <span id="setupRoundCount" class="font-['Teko'] text-7xl w-24 text-center select-none">8</span>
                    <div id="btn-plus" class="w-14 h-14 rounded-full bg-[#222] border border-[#444] text-2xl flex items-center justify-center cursor-pointer active:bg-[var(--theme-accent)] active:text-black transition-colors">+</div>
                </div>
                <div class="font-['Teko'] text-xl text-gray-500 tracking-wider">TOTAL TIME: <span id="totalTimePreview" class="text-white">--:--</span></div>
            </div>
        </div>

        <div class="pt-4 shrink-0">
            <button id="btn-start-fight" class="w-full py-3 border-2 border-[var(--theme-accent)] text-[var(--theme-accent)] hover:bg-[var(--theme-accent)] hover:text-black font-['Teko'] text-3xl rounded-full tracking-widest transition-all active:scale-[0.99]">START FIGHT</button>
        </div>
    </div>

    <div id="timer-screen" class="hidden flex-col flex-1 min-h-0 container-view">
        <div class="grid grid-cols-2 w-full h-full">
            <div class="flex flex-col justify-center items-center h-full border-r border-[#222]">
                <div id="mainTimer" class="font-['Teko'] text-[26vh] font-bold text-[var(--theme-accent)] tracking-tight leading-none">00:00</div>
                <div class="font-['Teko'] text-4xl text-gray-400 tracking-wider mt-2">TOTAL: <span id="totalTimer">00:00</span></div>
            </div>
            <div class="flex flex-col justify-center h-full pl-8 gap-4">
                <div id="statusText" class="font-['Teko'] text-4xl text-[var(--theme-accent)] tracking-widest uppercase">ROUND 1</div>
                
                <div class="bg-[#141414] p-4 rounded-xl shadow-lg flex-[2] min-h-0 flex flex-col justify-center">
                    <div class="text-xs text-gray-500 tracking-widest uppercase mb-1">CURRENT COMBO</div>
                    <div id="currentPattern" class="font-['Teko'] text-[9vh] text-white flex flex-col items-center justify-center gap-2 leading-none">GET READY</div>
                </div>
                
                <div class="pl-2 flex-[1] min-h-0 flex flex-col justify-center">
                    <div class="text-xs text-gray-500 tracking-widest uppercase mb-1">NEXT UP</div>
                    <div id="nextPattern" class="font-['Teko'] text-[4vh] text-gray-500 flex gap-2 items-center">...</div>
                </div>
            </div>
        </div>
        <div class="flex gap-4 justify-center py-4 shrink-0 border-t border-[#222]">
            <button id="pauseBtn" class="px-12 py-2 border-2 border-[var(--theme-accent)] text-[var(--theme-accent)] hover:bg-[var(--theme-accent)] hover:text-black font-['Teko'] text-2xl rounded-full min-width-[160px] transition-colors">PAUSE</button>
            <button id="stopBtn" class="px-12 py-2 border-2 border-red-500 text-red-500 hover:bg-red-500 hover:text-white font-['Teko'] text-2xl rounded-full min-width-[160px] transition-colors">END</button>
        </div>
    </div>

    <div id="finish-screen" class="hidden flex-col flex-1 items-center justify-center text-center container-view">
        <h1 class="font-['Teko'] text-[14vh] text-[var(--theme-green)] tracking-widest leading-none m-0">VICTORY</h1>
        <div id="finishLevelText" class="font-['Teko'] text-[4vh] text-white tracking-wide uppercase mb-4">COMPLETED</div>
        <div class="bg-[#141414] border border-[#333] px-12 py-4 rounded-2xl mb-6">
            <span class="text-xs text-gray-500 tracking-widest uppercase">ROUNDS Completed</span><br>
            <span id="finishRoundsVal" class="font-['Teko'] text-[8vh] text-[var(--theme-accent)] leading-none">8</span>
        </div>
        <button id="btn-restart" class="px-24 py-3 border-2 border-[var(--theme-accent)] text-[var(--theme-accent)] hover:bg-[var(--theme-accent)] hover:text-black font-['Teko'] text-3xl rounded-full tracking-widest transition-all">DONE</button>
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
